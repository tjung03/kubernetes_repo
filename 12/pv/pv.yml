# NFS 주소와 경로는 실습 환경 예시입니다. 실제 서버·내보내기 경로를 확인하세요.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv1
spec:
  # 볼륨 특성
  capacity:
    storage: 4Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Delete
  storageClassName: manual
  # 볼륨 정의
  nfs:
    path: /nas/k8s
    server: 192.168.10.14
